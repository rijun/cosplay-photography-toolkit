[project]
name = "cosplay-photography-toolkit"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.2",
]

[dependency-groups]
dev = [
    "boto3-stubs~=1.42.59",
    "django-stubs>=6.0.0",
    "djangorestframework-stubs>=3.16.8",
    "mypy>=1.15",
    "ruff>=0.11",
    "celery-types>=0.26.0",
]
web = [
    "django>=6.0.2",
    "django-environ>=0.13.0",
    "psycopg2-binary>=2.9.11",
    "djangorestframework>=3.15",
    "boto3>=1.35",
    "nh3>=0.3.3",
    "gunicorn>=25.1.0",
    "whitenoise[brotli]>=6.12.0",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.0",
]
cli = [
    "click>=8.1",
    "boto3>=1.35",
    "httpx>=0.28",
    "pillow>=12.1.1",
]

[project.scripts]
photo-tool = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.ruff]
src = ["web", "cli"]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
mypy_path = "web"
files = ["web/gallery", "web/api", "web/config", "cli"]
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "environ"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
